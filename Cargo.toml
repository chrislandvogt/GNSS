[workspace]
resolver = "3"
members = ["crates/*", "apps/cli", "apps/relay", "apps/web/core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/chrislandvogt/GNSS"
# Nothing is published until the project has a name (D-014).
publish = false

[workspace.dependencies]
gnss-adjust = { path = "crates/adjust" }
gnss-api = { path = "crates/api" }
gnss-datum = { path = "crates/datum" }
gnss-fetch = { path = "crates/fetch" }
gnss-formats = { path = "crates/formats" }
gnss-antennas = { path = "crates/antennas" }
gnss-model = { path = "crates/model" }
gnss-rinex-io = { path = "crates/rinex-io" }
gnss-pipeline = { path = "crates/pipeline" }
gnss-report = { path = "crates/report" }
gnss-store = { path = "crates/store" }
gnss-relay = { path = "apps/relay" }
hifitime = "4.3"
js-sys = "0.3"
# One maths library on every target (D-024).
libm = "0.2.16"
# Without "std": its dynamic matrix products would go to matrixmultiply, which
# picks SIMD and FMA kernels by CPU at run time, so results would differ
# between machines (D-024). Its own loops are the same everywhere.
# Pipeline node keys (ARCHITECTURE.md section 7). "pure": the same Rust code on
# every target, with no C compiler; keys are small, so speed doesn't matter.
blake3 = { version = "=1.8.7", default-features = false, features = ["std", "pure"] }
# Project zips (store::zip). Both already come with tiff's deflate.
crc32fast = "1.5"
miniz_oxide = "0.9"
# JSON Schemas for the project files, so editors check them as you type
# (ARCHITECTURE.md section 6).
schemars = "=1.2.2"
nalgebra = { version = "0.35", default-features = false, features = ["alloc", "libm-force"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
# Gzip, as data sources publish RINEX and products (M7). The pure-Rust backend.
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
# Reading jurisdiction packs (ARCHITECTURE.md section 11.6).
toml = "1.1"
# GeoTIFF grids (D-011). Deflate and LZW only: PROJ's grids use deflate.
tiff = { version = "0.11", default-features = false, features = ["deflate", "lzw"] }
# Downloads, natively (M7). rustls with the platform's certificates, so a
# proxy that inspects TLS with its own CA (common in agencies) works; proxies
# come from the usual environment variables.
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "platform-verifier"] }
wasm-bindgen = "0.2"
wasm-bindgen-test = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
# Code must never panic on user data (CONVENTIONS.md). Tests may unwrap.
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# The web core is shipped to every user, so optimise it for size as well as speed.
[profile.release-web]
inherits = "release"
opt-level = "s"
lto = "fat"
