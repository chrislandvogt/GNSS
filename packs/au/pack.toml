# The Australian jurisdiction pack, version 0 (ARCHITECTURE.md section 11.6).
#
# A pack is data, not code. This one declares the frames, transformations,
# grids and height models used in Australia, and where to get the grid files.
# The datum crate implements the transformations, and its pack test
# (crates/datum/tests/pack.rs) checks that everything named here exists there.
# Standards and data sources come in later milestones (M6 and M7).
#
# Grid files are fetched and checked against their SHA-256, not committed or
# bundled. `browser` says whether the web app can download a file directly
# ("direct", because the host sends cross-origin headers) or needs the relay or
# a data pack ("relay"). See ARCHITECTURE.md section 13.

[pack]
id = "au"
name = "Australia"
version = "0.1.0"

[frames]
# Results are delivered in GDA2020, and adjustments work in ATRF2014 (D-017).
target = "GDA2020"
adjustment = "ATRF2014"
supported = [
    "ITRF2020",
    "IGS20",
    "ITRF2014",
    "ITRF2008",
    "ITRF2005",
    "ATRF2014",
    "GDA2020",
    "GDA94",
    "WGS 84 (G2296)",
    "WGS 84 (G2139)",
    "WGS 84",
]

# Transformations, by their EPSG names. Each can be used in either direction.

[[transformations]]
name = "ITRF2014 to ITRF2020 (1)"
epsg = 9991

[[transformations]]
name = "ITRF2008 to ITRF2014 (1)"
epsg = 7790

[[transformations]]
name = "ITRF2008 to ITRF2020 (1)"
epsg = 9992

[[transformations]]
name = "ITRF2005 to ITRF2008 (2)"
epsg = 6389

[[transformations]]
name = "IGS20 = ITRF2020"
# EPSG has no transformation: IGS20 is the IGS realisation of ITRF2020.

[[transformations]]
name = "ITRF2014 to ATRF2014 (1)"
epsg = 9460

[[transformations]]
name = "ATRF2014 to GDA2020 (1)"
epsg = 9459

[[transformations]]
name = "ITRF2014 to GDA2020 (1)"
epsg = 8049

[[transformations]]
name = "ITRF2008 to GDA2020 (GA)"
# Geoscience Australia's direct transformation, as DynAdjust uses. EPSG has none.
use = """\
Preferred for ITRF2008 coordinates and vectors in Australia: it's fitted to \
Australian sites, where the chain through ITRF2014 and the plate motion model \
differs by up to 0.3 mas and 2 ppb."""

[[transformations]]
name = "ITRF2005 to GDA2020 (GA)"
# Geoscience Australia's direct transformation, as DynAdjust uses. EPSG has none.

[[transformations]]
name = "GDA94 to GDA2020 (1)"
epsg = 8048
use = """\
The conformal transformation. Use it for GDA94 coordinates that don't carry the \
state and territory networks' distortion, such as those computed directly from \
CORS, and for Christmas and Cocos Islands, which the grid doesn't cover."""

[[transformations]]
name = "GDA94 to GDA2020 (2)"
epsg = 8447
grid = "gda94-gda2020-conformal-and-distortion"
use = """\
The conformal and distortion grid. Use it for GDA94 coordinates from the state \
and territory survey networks, which carry their distortion. It covers mainland \
Australia and Tasmania. Ellipsoidal heights follow the conformal transformation, \
since the grid is 2D. The GDA2020 Technical Manual and ICSM's fact sheet T1 give \
the guidance."""

[[transformations]]
name = "WGS 84 (G2296) to ITRF2020 (1)"
epsg = 10608

[[transformations]]
name = "WGS 84 (G2139) to ITRF2014 (1)"
epsg = 9757

[[transformations]]
name = "WGS 84 ensemble to WGS 84 (G2139)"
# EPSG's datum ensemble 6326, accurate to 2 m.

[[height_models]]
name = "AUSGeoid2020"
epsg = 8451
# GDA2020 ellipsoidal heights to AHD (EPSG:5711).
frame = "GDA2020"
height = "AHD"
grid = "ausgeoid2020"
uncertainty = "ausgeoid2020-uncertainty"

[[grids]]
id = "gda94-gda2020-conformal-and-distortion"
kind = "horizontal-shift"
description = "ICSM's GDA94 to GDA2020 conformal and distortion grid, version NAT_DC6 (2017-11-20)"
licence = "CC BY 4.0, Intergovernmental Committee on Surveying and Mapping"

[[grids.files]]
# PROJ-data's GeoTIFF of ICSM's GDA94_GDA2020_conformal_and_distortion.gsb.
# ICSM's own NTv2 file reads too, but isn't listed until its hash is checked.
format = "geotiff"
file = "au_icsm_GDA94_GDA2020_conformal_and_distortion.tif"
url = "https://raw.githubusercontent.com/OSGeo/PROJ-data/1.25.0/au_icsm/au_icsm_GDA94_GDA2020_conformal_and_distortion.tif"
sha256 = "89bb9e5c55a714c8925ddc134bf4c191be8df2607b229a05efb778f5f6166ee0"
bytes = 27272664
browser = "direct" # checked 2026-10-19

[[grids]]
id = "ausgeoid2020"
kind = "geoid"
description = "AUSGeoid2020, release 2018-02-01: N, the separation of AHD from the GDA2020 ellipsoid"
licence = "CC BY 4.0, Geoscience Australia"

[[grids.files]]
# Geoscience Australia's NTv2 file: N and the deflections of the vertical.
format = "ntv2"
file = "AUSGeoid2020_20180201.gsb"
url = "https://s3-ap-southeast-2.amazonaws.com/geoid/AUSGeoid/AUSGeoid2020_20180201.gsb"
sha256 = "aa40b8953d7ed00410f586d94ea00b8e466a1f37c328b60399074a744ca14bdb"
bytes = 247277168
browser = "relay" # no cross-origin headers, checked 2026-10-19

[[grids.files]]
# PROJ-data's GeoTIFF of the same model: N only, with identical values.
format = "geotiff"
file = "au_ga_AUSGeoid2020_20180201.tif"
url = "https://raw.githubusercontent.com/OSGeo/PROJ-data/1.25.0/au_ga/au_ga_AUSGeoid2020_20180201.tif"
sha256 = "1eb8bc33f6bf27e6f16d277ad4f38d92ffaec33a7e6e355b6f840a7ab79998af"
bytes = 5839686
browser = "direct" # checked 2026-10-19

[[grids]]
id = "ausgeoid2020-uncertainty"
kind = "geoid-uncertainty"
description = "AUSGeoid2020's one-sigma uncertainty of N, release 2018-02-01"
licence = "CC BY 4.0, Geoscience Australia"

[[grids.files]]
format = "ntv2"
file = "AUSGeoid2020_20180201_error.gsb"
url = "https://s3-ap-southeast-2.amazonaws.com/geoid/AUSGeoid/AUSGeoid2020_20180201_error.gsb"
sha256 = "1e8d87a0404f8f26f53dc6e15b85d972edd7be8fad3612cfd666beaafdd50f5a"
bytes = 247277168
browser = "relay" # no cross-origin headers, checked 2026-10-19

# Data sources (M7, ARCHITECTURE.md section 13). `hosts` lists every host a
# source's files come from, redirects included: the relay forwards only to
# these. `attribution` goes into reports word for word.

[[sources]]
id = "ga-archive"
name = "Geoscience Australia GNSS Data Repository"
kind = "ga-archive"
url = "https://data.gnss.ga.gov.au/api/v1/rinexFiles"
# The Web API, and the archive's signed links to its files.
hosts = ["data.gnss.ga.gov.au", "geodesy-archive-permanent-storage-prod.s3.ap-southeast-2.amazonaws.com"]
browser = "direct" # checked 2026-10-15
licence = "CC BY 4.0, Geoscience Australia"
attribution = "CORS data from Geoscience Australia's GNSS Data Repository (https://gnss.ga.gov.au), CC BY 4.0."
# Broadcast navigation files are the same whichever station logged them; these
# stations publish mixed-constellation (_MN) files.
nav_stations = ["TID1", "STR1", "SYDN", "MOBS", "PERT", "DARW", "TOW2", "ALIC"]

[[sources]]
id = "ga-sites"
name = "Geoscience Australia CORS sites"
kind = "ga-sites"
url = "https://gws.geodesy.ga.gov.au/corsSites"
hosts = ["gws.geodesy.ga.gov.au"]
browser = "direct" # checked 2026-10-30
licence = "CC BY 4.0, Geoscience Australia"
attribution = "CORS site information from Geoscience Australia's GNSS site log service, CC BY 4.0."

[[sources]]
id = "ga-sitelogs"
name = "Geoscience Australia CORS site logs"
kind = "ga-sitelogs"
url = "https://gws.geodesy.ga.gov.au/api/siteLogs/search/findByFourCharacterId"
hosts = ["gws.geodesy.ga.gov.au"]
browser = "direct" # checked 2026-10-30
licence = "CC BY 4.0, Geoscience Australia"
attribution = "CORS site logs from Geoscience Australia's GNSS site log service, CC BY 4.0."

[[sources]]
id = "code"
name = "CODE (Center for Orbit Determination in Europe), AIUB"
kind = "code"
url = "https://download.aiub.unibe.ch"
# AIUB's download host redirects to its object store.
hosts = ["download.aiub.unibe.ch", "zhw-b.s3.cloud.switch.ch"]
browser = "relay" # no cross-origin headers, checked 2026-10-29
licence = "Free to use with citation; redistribution not stated"
# The citations CODE asks for are per product series; products.rs adds them.
attribution = "Orbits, clocks and Earth rotation from CODE, Astronomical Institute, University of Bern (Dach et al. 2026)."

[[sources]]
id = "igs-files"
name = "IGS antenna calibrations (archive of weekly releases)"
kind = "files"
# The current week's release sits in general/ until the next one comes out,
# then moves here, where releases stay.
url = "https://files.igs.org/pub/station/general/pcv_archive/"
hosts = ["files.igs.org"]
browser = "relay" # no cross-origin headers, checked 2026-10-15
licence = "IGS Data and Product Terms of Use (2020): open, without restriction, with attribution"
attribution = "Antenna calibrations from the International GNSS Service (igs20.atx, week 2434)."
# A weekly release, pinned (gnss_fetch::plan::ANTEX, D-028).
files = ["igs20_2434.atx.gz"]

# Served by the web app itself, so the browser needs no relay for it (D-028).
[[sources.app_files]]
name = "igs20_2434.atx.gz"
sha256 = "f0d9ad51b0f5160929f8bb1e5ea78e6221b3d8f4241e923a21108a9601a1f4e5"
bytes = 7762515
