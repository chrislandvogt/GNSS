[package]
name = "gnss-engine-host"
description = "Runs engine modules natively with wasmtime. The only crate that doesn't build for WebAssembly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
wasmtime = { version = "=49.0.3", default-features = false, features = ["cranelift", "runtime", "std", "parallel-compilation"] }
wasmtime-wasi = { version = "=49.0.3", default-features = false, features = ["p1"] }

[dev-dependencies]
gnss-store.workspace = true
tempfile = "3"
wat = "=1.258.3"

[lints]
workspace = true
