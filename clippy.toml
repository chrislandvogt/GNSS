allow-unwrap-in-tests = true
allow-expect-in-tests = true

# One maths library on every platform (D-024). These f64 methods call the
# platform's own maths library natively and a musl port in WebAssembly, and
# the libraries round differently. The libm crate gives the same bits everywhere.
disallowed-methods = [
  { path = "f64::powi", reason = "use libm::pow, or multiply (x * x) (D-024)" },
  { path = "f64::powf", reason = "use libm::pow (D-024)" },
  { path = "f64::exp", reason = "use libm::exp (D-024)" },
  { path = "f64::exp2", reason = "use libm::exp2 (D-024)" },
  { path = "f64::exp_m1", reason = "use libm::expm1 (D-024)" },
  { path = "f64::ln", reason = "use libm::log (D-024)" },
  { path = "f64::log", reason = "use libm::log(x) / libm::log(base) (D-024)" },
  { path = "f64::log2", reason = "use libm::log2 (D-024)" },
  { path = "f64::log10", reason = "use libm::log10 (D-024)" },
  { path = "f64::ln_1p", reason = "use libm::log1p (D-024)" },
  { path = "f64::cbrt", reason = "use libm::cbrt (D-024)" },
  { path = "f64::hypot", reason = "use libm::hypot (D-024)" },
  { path = "f64::sin", reason = "use libm::sin (D-024)" },
  { path = "f64::cos", reason = "use libm::cos (D-024)" },
  { path = "f64::tan", reason = "use libm::tan (D-024)" },
  { path = "f64::sin_cos", reason = "use libm::sincos (D-024)" },
  { path = "f64::asin", reason = "use libm::asin (D-024)" },
  { path = "f64::acos", reason = "use libm::acos (D-024)" },
  { path = "f64::atan", reason = "use libm::atan (D-024)" },
  { path = "f64::atan2", reason = "use libm::atan2 (D-024)" },
  { path = "f64::sinh", reason = "use libm::sinh (D-024)" },
  { path = "f64::cosh", reason = "use libm::cosh (D-024)" },
  { path = "f64::tanh", reason = "use libm::tanh (D-024)" },
  { path = "f64::asinh", reason = "use libm::asinh (D-024)" },
  { path = "f64::acosh", reason = "use libm::acosh (D-024)" },
  { path = "f64::atanh", reason = "use libm::atanh (D-024)" },
]
