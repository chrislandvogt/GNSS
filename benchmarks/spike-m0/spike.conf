# RTKLIB-EX configuration for the M0 engine spike.
# Static relative positioning, close to the v1 defaults in ARCHITECTURE.md 9.3.
# run.py writes a copy per case with pos1-soltype set to combined, forward or backward.
pos1-posmode       =static
pos1-frequency     =l1+l2
pos1-soltype       =combined
pos1-elmask        =15
pos1-snrmask_r     =off
pos1-snrmask_b     =off
pos1-dynamics      =off
pos1-tidecorr      =off
pos1-ionoopt       =brdc
pos1-tropopt       =saas
pos1-sateph        =brdc
pos1-navsys        =41
pos2-armode        =continuous
pos2-gloarmode     =off
pos2-bdsarmode     =on
pos2-arthres       =3
out-solformat      =xyz
out-outhead        =on
out-outopt         =on
out-timesys        =gpst
out-solstatic      =single
out-outstat        =off
ant1-anttype       =*
ant2-anttype       =*
ant2-postype       =rinexhead
file-satantfile    =igs14.atx
file-rcvantfile    =igs14.atx
