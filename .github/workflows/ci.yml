name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Crates that only build natively (ARCHITECTURE.md section 2).
  NATIVE_ONLY: --exclude gnss-engine-host --exclude gnss-cli --exclude gnss-relay

jobs:
  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # rustup installs the toolchain pinned in rust-toolchain.toml on first use.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The adjustment's speed target (ARCHITECTURE.md section 20), in an optimised build.
      - name: Time the adjustment
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --release -p gnss-adjust --test performance --locked -- --nocapture
      # GeoPackage exports, checked by SQLite and by GDAL.
      - name: Check GeoPackage exports with SQLite and GDAL
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -m venv "$RUNNER_TEMP/gpkg"
          "$RUNNER_TEMP/gpkg/bin/pip" install --quiet pyogrio
          "$RUNNER_TEMP/gpkg/bin/python" -I crates/formats/tests/oracle/check_gpkg.py
      # The grid readers on the grids PROJ publishes, beyond the test windows.
      - name: Fetch PROJ's published grids
        if: matrix.os == 'ubuntu-latest'
        run: python3 crates/datum/tests/oracle/fetch_grids.py "$RUNNER_TEMP/grids" --format geotiff
      - name: Test the grid readers on the published grids
        if: matrix.os == 'ubuntu-latest'
        env:
          GNSS_GRID_DIR: ${{ runner.temp }}/grids
        run: cargo test -p gnss-datum --test grids --locked published_grids_match_proj -- --nocapture

  wasm:
    name: WebAssembly (headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Install the wasm-bindgen test runner matching Cargo.lock
        run: |
          version="$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')"
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build
        run: cargo build --target wasm32-unknown-unknown --workspace $NATIVE_ONLY --locked
      - name: Clippy
        run: cargo clippy --target wasm32-unknown-unknown --workspace $NATIVE_ONLY --all-targets --locked -- -D warnings
      - name: Test in headless Chrome
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: |
          export CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver"
          cargo test --target wasm32-unknown-unknown --workspace $NATIVE_ONLY --locked
      - name: Time the adjustment in headless Chrome
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: |
          export CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver"
          cargo test --release --target wasm32-unknown-unknown -p gnss-adjust --test performance --locked -- --nocapture

  fuzz:
    name: Fuzz the file readers
    # Every parser of external data is fuzzed (CONVENTIONS.md section 6).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install nightly --profile minimal
      # Restores cargo-fuzz and the fuzz target's build, so both are quick after the first run.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/datum/fuzz
            crates/formats/fuzz
      - run: cargo +nightly install cargo-fuzz --locked
      - name: Fuzz for two minutes, starting from the test grids
        working-directory: crates/datum/fuzz
        run: |
          mkdir -p corpus/grid
          cp ../tests/data/grids/*.gsb ../tests/data/grids/*.tif corpus/grid/
          cargo +nightly fuzz run grid corpus/grid -- -max_total_time=120 -max_len=262144 -rss_limit_mb=2048
      - name: Fuzz each format reader for 30 seconds, starting from the test files
        working-directory: crates/formats/fuzz
        run: |
          for target in dynaml starnet tdef rtklib sinex csv; do mkdir -p "corpus/$target"; done
          cp ../tests/data/dynaml/*.xml corpus/dynaml/
          cp ../tests/data/tdef/*.asc corpus/tdef/
          cp ../tests/data/rtklib/*.pos corpus/rtklib/
          cp ../tests/data/sinex/*.SNX corpus/sinex/
          printf 'G1 A-B 1 2 3\nG2 1e-6 1e-6 1e-6\nG3 0 0 0\n' > corpus/starnet/vector.gps
          printf 'from,to,dx,dy,dz,sd_x,sd_y,sd_z\nA,B,1,2,3,0.001,0.001,0.001\n' > corpus/csv/vectors.csv
          for target in dynaml starnet tdef rtklib sinex csv; do
            cargo +nightly fuzz run "$target" "corpus/$target" -- -max_total_time=30 -max_len=65536 -rss_limit_mb=2048
          done
      - name: Keep the input that failed
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-artifacts
          path: |
            crates/datum/fuzz/artifacts/
            crates/formats/fuzz/artifacts/

  deny:
    name: Licences and advisories (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  engine-module:
    name: RTKLIB-EX module (reproducible build)
    runs-on: ubuntu-latest
    env:
      WASI_SDK_VERSION: "34"
      WASMTIME_VERSION: "49.0.3"
    steps:
      - uses: actions/checkout@v5
      - name: Install wasi-sdk
        run: |
          curl -sSfL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux" >> "$GITHUB_ENV"
      - name: Build the module
        run: engine-modules/rtklib-ex/build.sh
      - name: Check the module hash is reproduced
        working-directory: engine-modules/rtklib-ex/dist
        run: grep ' rnx2rtkp.wasm$' ../golden.sha256 | sha256sum -c -
      - name: Install wasmtime
        run: |
          curl -sSfL "https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/wasmtime-v${WASMTIME_VERSION}-x86_64-linux.tar.xz" \
            | tar xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasmtime-v${WASMTIME_VERSION}-x86_64-linux" >> "$GITHUB_PATH"
      - name: Smoke test against RTKLIB's test data
        run: engine-modules/rtklib-ex/smoke-test.sh
      - name: Add RTKLIB's test data for the web app's end-to-end test
        run: |
          mkdir -p engine-modules/rtklib-ex/dist/testdata
          cp engine-modules/rtklib-ex/.src/rtklib/test/data/rinex/{07590920.05o,30400920.05n,30400920.05o} \
            engine-modules/rtklib-ex/dist/testdata/
      - uses: actions/upload-artifact@v6
        with:
          name: rnx2rtkp-wasm
          path: engine-modules/rtklib-ex/dist/

  web:
    name: Web app
    # Built from the exact engine module the engine-module job produced and checked.
    needs: engine-module
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web/ui
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/ui/package-lock.json
      - name: Install the wasm-bindgen CLI matching Cargo.lock
        run: |
          version="$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')"
          cargo install wasm-bindgen-cli --version "$version" --locked
      - uses: actions/download-artifact@v7
        with:
          name: rnx2rtkp-wasm
          path: engine-modules/rtklib-ex/dist
      - run: npm ci
      - name: Check JavaScript licences (D-005)
        run: npm run licences
      - run: npm run build
      - name: Type-check
        run: npm run check
      - name: Install browsers for Playwright
        run: npx playwright install --with-deps chromium firefox webkit
      # The engine must give byte-identical output in every browser engine (D-023).
      - name: End-to-end engine test in Chromium
        run: npm run test:e2e -- ../../../engine-modules/rtklib-ex/dist/testdata
      - name: End-to-end engine test in Firefox
        run: BROWSER=firefox npm run test:e2e -- ../../../engine-modules/rtklib-ex/dist/testdata
      - name: End-to-end engine test in WebKit
        run: BROWSER=webkit npm run test:e2e -- ../../../engine-modules/rtklib-ex/dist/testdata
      - name: End-to-end app test in Chromium (adjustment, report, downloads, storage, offline)
        run: npm run test:app
      - name: Upload the deployable site
        uses: actions/upload-artifact@v6
        with:
          name: web-app
          path: apps/web/ui/dist/

  deploy:
    name: Deploy main to Cloudflare Pages
    # Only the site CI has just built and tested goes out, once everything
    # else has passed. Main is the development version, at the Pages
    # project's "main" branch address; releases deploy the site root and
    # /v/<version>/ (docs/DEPLOYING.md).
    needs: [native, wasm, fuzz, deny, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare is set up
        id: cloudflare
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Nothing deployed: the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets aren't set (docs/DEPLOYING.md)."
          fi
      - uses: actions/download-artifact@v7
        if: steps.cloudflare.outputs.ready == 'true'
        with:
          name: web-app
          path: dist
      - uses: actions/setup-node@v5
        if: steps.cloudflare.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Deploy
        if: steps.cloudflare.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'gnss' }}
          WRANGLER: wrangler@4.148.0
        run: |
          # The first deploy creates the project, with releases as its
          # production branch.
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT"
          status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api")"
          case "$status" in
            200) ;;
            404) npx --yes "$WRANGLER" pages project create "$PROJECT" --production-branch production ;;
            *) echo "::error::Cloudflare answered $status for the Pages project $PROJECT; check the token's permissions (docs/DEPLOYING.md)."; exit 1 ;;
          esac
          npx --yes "$WRANGLER" pages deploy dist --project-name "$PROJECT" --branch main \
            --commit-hash "$GITHUB_SHA" --commit-dirty=false

  dco:
    name: Developer Certificate of Origin
    # Contributions from forks must be signed off (CONTRIBUTING.md).
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email="$(git log -1 --format=%ae "$commit")"
            if ! git log -1 --format=%B "$commit" | grep -i "^Signed-off-by:" | grep -qiF "<$email>"; then
              echo "::error::commit $commit isn't signed off by its author ($email)"
              status=1
            fi
          done
          exit $status
