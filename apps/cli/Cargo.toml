[package]
name = "gnss-cli"
description = "Command-line interface: scripting, batch work, the benchmark, data packs and serving the web app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The binary name follows the project name once it's chosen (D-014).
[[bin]]
name = "gnss"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
gnss-api.workspace = true
gnss-datum.workspace = true
gnss-engine-host.workspace = true
gnss-model.workspace = true
gnss-relay.workspace = true
gnss-store.workspace = true
hifitime.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
