# cargo-deny policy. See decision D-005: no GPL, AGPL or LGPL code may be
# linked into the project. Copyleft tools may only run as separate processes
# or separately built engine modules.

[graph]
all-features = true

[advisories]
# Fail on security advisories and on unmaintained crates we depend on directly.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Permissive licences only. MPL-2.0's file-level copyleft is compatible with
# Apache-2.0 (D-005, D-007).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    # A permissive licence for data: Mozilla's list of root certificates
    # (webpki-roots, webpki-root-certs), which the downloader's TLS falls
    # back on where the platform has no trust store (M7).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
# The allow list is policy, not a description of today's dependencies.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Our own path dependencies have no version, which is fine for unpublished crates.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
